name: One-time MyPhuQuoc Cloudflare zone setup

on:
  push:
    branches:
      - myphuquoc-brand-domain-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-zone-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure myphuquoc.com exists in Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=myphuquoc.com" \
            -o /tmp/zone-before.json

          found=$(node -e "const p=require('/tmp/zone-before.json'); console.log(Array.isArray(p.result)&&p.result.length ? 'true' : 'false')")

          if [ "$found" != "true" ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"myphuquoc.com\",\"account\":{\"id\":\"$CLOUDFLARE_ACCOUNT_ID\"},\"type\":\"full\"}" \
              "https://api.cloudflare.com/client/v4/zones" \
              -o /tmp/zone-create.json
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=myphuquoc.com" \
            -o /tmp/zone-after.json

          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/zone-after.json', 'utf8'));
          if (!p.success) {
            console.error('Cloudflare API request failed');
            process.exit(1);
          }
          const zone = Array.isArray(p.result) ? p.result[0] : null;
          if (!zone) {
            console.error('ZONE_CREATED=false');
            if (fs.existsSync('/tmp/zone-create.json')) {
              const create = JSON.parse(fs.readFileSync('/tmp/zone-create.json', 'utf8'));
              console.error(JSON.stringify({success:create.success, errors:create.errors}, null, 2));
            }
            process.exit(1);
          }
          console.log('ZONE_CREATED=true');
          console.log(`ZONE_NAME=${zone.name}`);
          console.log(`ZONE_ID=${zone.id}`);
          console.log(`ZONE_STATUS=${zone.status}`);
          console.log(`ZONE_PAUSED=${zone.paused}`);
          console.log(`ZONE_TYPE=${zone.type}`);
          console.log(`NAMESERVERS=${(zone.name_servers || []).join(',')}`);
          NODE
