name: visual-qa

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phuquoclux_visual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phuquoclux_visual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser journeys and take QA screenshots
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/phuquoclux_visual
        run: npm run test:visual

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phuquoclux-visual-qa
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 5
