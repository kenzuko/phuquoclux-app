name: One-time production smoke

on:
  push:
    branches:
      - production-smoke-20261003

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production Worker health
        shell: bash
        run: |
          set -euo pipefail
          base="https://phuquoclux-app.kenzuko.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/health" -o /tmp/health.json
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const checks = [
            ['ok', p.ok === true],
            ['commerce.mode=prototype', p.commerce?.mode === 'prototype'],
            ['hyperdriveBindingConfigured=true', p.readiness?.hyperdriveBindingConfigured === true],
            ['manageBookingDatabaseInjected=true', p.readiness?.manageBookingDatabaseInjected === true],
            ['manageBookingExchangeConfigReady=false', p.readiness?.manageBookingExchangeConfigReady === false],
            ['guestBookingAccessConnected=false', p.commerce?.guestBookingAccessConnected === false],
            ['manageBookingDeliveryConnected=false', p.commerce?.manageBookingDeliveryConnected === false],
          ];
          for (const [name, pass] of checks) {
            console.log(`${pass ? 'PASS' : 'FAIL'} ${name}`);
            if (!pass) process.exitCode = 1;
          }
          if (process.exitCode) {
            console.error(JSON.stringify(p, null, 2));
            process.exit(process.exitCode);
          }
          NODE

      - name: Verify public shell responds
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -o /dev/null https://phuquoclux-app.kenzuko.workers.dev/
