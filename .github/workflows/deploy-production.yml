name: Deploy PhuQuocLux App

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-phuquoclux-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Domain checks
        run: npm run test:domain

      - name: Build
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_READY=true" >> "$GITHUB_ENV"
            echo "Cloudflare credentials available."
          else
            echo "CLOUDFLARE_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Deploy skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added as repository secrets."
          fi

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
