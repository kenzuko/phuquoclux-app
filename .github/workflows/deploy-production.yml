name: Deploy PhuQuocLux App

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-phuquoclux-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Domain checks
        run: npm run test:domain

      - name: Build
        run: npm run build

      - name: Check production deployment gate
        env:
          DEPLOY_ENABLED: "true"
          MAP_STYLE_URL: "https://tiles.openfreemap.org/styles/liberty"
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true

          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "::warning::Production deploy is disabled. Set PHUQUOCLUX_DEPLOY_ENABLED=true only after QA approval."
            ready=false
          fi

          if [ -z "$MAP_STYLE_URL" ] || echo "$MAP_STYLE_URL" | grep -q "demotiles.maplibre.org"; then
            echo "::warning::Production Map style is not configured. Set PHUQUOCLUX_MAP_STYLE_URL to the approved provider style."
            ready=false
          fi

          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deploy credentials are missing."
            ready=false
          fi

          echo "PRODUCTION_READY=$ready" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Workers
        if: env.PRODUCTION_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAP_STYLE_URL: "https://tiles.openfreemap.org/styles/liberty"
        run: |
          npx wrangler deploy \
            --var "MAP_STYLE_URL:$MAP_STYLE_URL" \
            --var "COMMERCE_MODE:prototype"
