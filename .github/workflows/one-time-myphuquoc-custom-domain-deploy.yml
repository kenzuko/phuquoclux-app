name: One-time My Phu Quoc DNS multi-resolver audit

on:
  push:
    branches:
      - one-time-myphuquoc-custom-domain-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-custom-domain-deploy.yml"

permissions:
  contents: read

jobs:
  dns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit delegation DNS and HTTPS from public resolvers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null

          echo '=== DELEGATION ==='
          dig +short NS myphuquoc.com

          for resolver in 1.1.1.1 8.8.8.8 9.9.9.9; do
            echo "=== resolver $resolver apex A ==="
            answer=$(dig +short A myphuquoc.com @$resolver)
            echo "$answer"
            test -n "$answer"

            echo "=== resolver $resolver www A ==="
            www=$(dig +short A www.myphuquoc.com @$resolver)
            echo "$www"
            test -n "$www"
          done

          echo '=== authoritative apex A ==='
          for ns in holly.ns.cloudflare.com jobs.ns.cloudflare.com; do
            echo "--- $ns"
            auth=$(dig +short A myphuquoc.com @$ns)
            echo "$auth"
            test -n "$auth"
          done

          echo '=== normal HTTPS apex ==='
          curl --fail --silent --show-error --max-time 20 https://myphuquoc.com/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"mode":"prototype"' /tmp/health.json

          echo '=== normal HTTPS www redirect ==='
          headers=$(curl --silent --show-error --max-time 20 -I 'https://www.myphuquoc.com/test-path?x=1' | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -Eq '^HTTP/[^ ]+ (301|308)$'
          echo "$headers" | grep -Fqi 'location: https://myphuquoc.com/test-path?x=1'

          echo 'DNS_MULTI_RESOLVER_AUDIT=PASS'
