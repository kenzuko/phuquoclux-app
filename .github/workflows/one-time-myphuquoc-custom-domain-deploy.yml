name: One-time My Phu Quoc custom domain audit

on:
  push:
    branches:
      - one-time-myphuquoc-custom-domain-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-custom-domain-deploy.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit Cloudflare zone, Worker domains and public DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl --fail --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones?name=myphuquoc.com" -o /tmp/zone.json
          zone_id=$(node -e "const p=require('/tmp/zone.json'); const z=p.result?.[0]; if(!z) process.exit(2); console.log(z.id)")
          node -e "const p=require('/tmp/zone.json'); const z=p.result?.[0]; console.log(JSON.stringify({zone:z?.name,status:z?.status,paused:z?.paused,name_servers:z?.name_servers},null,2))"

          curl --fail --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?service=phuquoclux-app" -o /tmp/domains.json
          node -e "const p=require('/tmp/domains.json'); console.log(JSON.stringify((p.result||[]).map(d=>({hostname:d.hostname,service:d.service,zone_name:d.zone_name,cert_present:Boolean(d.cert_id)})),null,2))"

          for host in myphuquoc.com www.myphuquoc.com; do
            curl --fail --silent --show-error "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$host" -o "/tmp/dns-${host}.json"
            node -e "const p=require('/tmp/dns-${host}.json'); console.log(JSON.stringify({host:'${host}',records:(p.result||[]).map(r=>({type:r.type,name:r.name,content:r.content,proxied:r.proxied}))},null,2))"
            echo "DoH Cloudflare $host"
            curl --fail --silent --show-error -H 'accept: application/dns-json' \
              "https://cloudflare-dns.com/dns-query?name=$host&type=A" | \
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);console.log(JSON.stringify({Status:p.Status,Answer:(p.Answer||[]).map(a=>a.data)},null,2))})"
          done

          echo "HTTP apex check"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --max-time 20 https://myphuquoc.com/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"mode":"prototype"' /tmp/health.json

          echo "HTTP www redirect check"
          headers=$(curl --silent --show-error --retry 4 --retry-delay 3 --max-time 20 -I 'https://www.myphuquoc.com/test-path?x=1' | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -Eq '^HTTP/[^ ]+ (301|308)$'
          echo "$headers" | grep -Fxq 'location: https://myphuquoc.com/test-path?x=1'

          echo "CUSTOM_DOMAIN_AUDIT=PASS"
