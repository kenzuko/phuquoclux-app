name: One-time My Phu Quoc live browser audit

on:
  push:
    branches:
      - one-time-myphuquoc-custom-domain-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-custom-domain-deploy.yml"

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main app dependencies
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Audit live homepage in a real browser
        working-directory: web
        run: |
          cat > live-audit.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const consoleErrors=[];
          const pageErrors=[];
          page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
          page.on('pageerror', err => pageErrors.push(String(err)));
          const response = await page.goto('https://myphuquoc.com/', { waitUntil:'networkidle', timeout:60000 });
          const title = await page.title();
          const bodyText = (await page.locator('body').innerText()).slice(0,4000);
          const h1 = await page.locator('h1').first().innerText().catch(()=> '');
          const brand = await page.getByText('My Phu Quoc', { exact:false }).first().isVisible().catch(()=>false);
          const metrics = await page.evaluate(() => ({
            bodyW: document.body.scrollWidth,
            bodyH: document.body.scrollHeight,
            bodyDisplay: getComputedStyle(document.body).display,
            bodyVisibility: getComputedStyle(document.body).visibility,
            bodyOpacity: getComputedStyle(document.body).opacity,
            textLength: document.body.innerText.length,
          }));
          await page.screenshot({ path:'myphuquoc-live-mobile.png', fullPage:true });
          fs.writeFileSync('myphuquoc-live.txt', JSON.stringify({
            status: response?.status(), title, h1, brand, metrics, consoleErrors, pageErrors, bodyText
          }, null, 2));
          console.log(fs.readFileSync('myphuquoc-live.txt','utf8'));
          if (response?.status() !== 200) process.exit(2);
          if (!title.includes('My Phu Quoc')) process.exit(3);
          if (!bodyText.includes('Phú Quốc')) process.exit(4);
          if (metrics.textLength < 200) process.exit(5);
          if (metrics.bodyVisibility === 'hidden' || metrics.bodyOpacity === '0') process.exit(6);
          if (pageErrors.length) process.exit(7);
          await browser.close();
          NODE
          node live-audit.mjs
      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myphuquoc-live-browser-audit
          path: |
            web/myphuquoc-live-mobile.png
            web/myphuquoc-live.txt
          if-no-files-found: warn
