name: One-time My Phu Quoc custom domain smoke

on:
  push:
    branches:
      - one-time-myphuquoc-custom-domain-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-custom-domain-deploy.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke apex and www custom domains
        run: |
          set -euo pipefail

          apex_ok=false
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 https://myphuquoc.com/api/health -o /tmp/health.json; then
              if grep -q '"ok":true' /tmp/health.json && grep -q '"mode":"prototype"' /tmp/health.json; then
                apex_ok=true
                break
              fi
            fi
            sleep 6
          done
          test "$apex_ok" = "true"

          www_ok=false
          for i in $(seq 1 30); do
            headers=$(curl --silent --show-error --max-time 15 -I 'https://www.myphuquoc.com/test-path?x=1' 2>/dev/null | tr -d '\r' || true)
            if echo "$headers" | grep -Eq '^HTTP/[^ ]+ (301|308)$' && \
               echo "$headers" | grep -Fxq 'location: https://myphuquoc.com/test-path?x=1'; then
              www_ok=true
              break
            fi
            sleep 6
          done
          test "$www_ok" = "true"

          echo "APEX_HEALTH=PASS"
          echo "WWW_CANONICAL_REDIRECT=PASS"
