name: One-time My Phu Quoc Hyperdrive outbox isolation test

on:
  push:
    branches:
      - one-time-myphuquoc-custom-domain-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-custom-domain-deploy.yml"

permissions:
  contents: read

jobs:
  hyperdrive-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Prepare isolated Hyperdrive contract worker
        working-directory: web
        run: |
          set -euo pipefail
          mkdir -p .tmp-hyperdrive-smoke
          cat > .tmp-hyperdrive-smoke/worker.ts <<'NODE'
          import pg from 'pg';
          import { claimOutboxBatch, markOutboxPublished, scheduleOutboxRetry } from '../app/repositories/postgres-outbox.server';
          import { processOutboxBatch } from '../app/services/outbox-publisher.server';
          import { importManageBookingDeliveryDerivationKey, issueOrReuseManageBookingDeliveryAccess } from '../app/repositories/postgres-booking-delivery-access.server';
          import { buildManageBookingLink } from '../app/services/manage-booking-delivery.server';
          import { createResendManageBookingDeliveryProvider } from '../app/services/resend-manage-booking-delivery.server';

          const { Client } = pg;
          const need = (value: unknown, code: string): asserts value => { if (!value) throw new Error(code); };

          function manager(client: pg.Client) {
            return {
              async transaction<T>(work: (tx: { query<Row extends object = Record<string, unknown>>(sql: string, parameters: readonly unknown[]): Promise<{ rows: Row[] }> }) => Promise<T>) {
                await client.query('BEGIN');
                try {
                  const result = await work({
                    async query<Row extends object = Record<string, unknown>>(sql: string, parameters: readonly unknown[]) {
                      const response = await client.query<Row>(sql, [...parameters]);
                      return { rows: response.rows };
                    },
                  });
                  await client.query('COMMIT');
                  return result;
                } catch (error) {
                  await client.query('ROLLBACK').catch(() => {});
                  throw error;
                }
              },
            };
          }

          export default {
            async fetch(_request: Request, env: { HYPERDRIVE: { connectionString: string } }) {
              const client = new Client({ connectionString: env.HYPERDRIVE.connectionString });
              const steps: Record<string, unknown> = {};
              try {
                await client.connect();
                const shape = await client.query(`
                  select current_database() as database_name,
                         current_user as database_user,
                         to_regclass('public.outbox_events') is not null as outbox_table,
                         to_regclass('public.bookings') is not null as bookings_table,
                         to_regclass('public.booking_access_tokens') is not null as access_table,
                         exists (
                           select 1 from information_schema.columns
                            where table_schema='public' and table_name='outbox_events' and column_name='lease_token'
                         ) as lease_column
                `);
                const s = shape.rows[0];
                need(s?.outbox_table && s?.bookings_table && s?.access_table && s?.lease_column, 'PUBLIC_SCHEMA_NOT_READY');
                steps.runtime = s;

                // Manual TEMP tables avoid copying permanent indexes/constraints.
                // They shadow public names on this pinned pg connection, so all
                // test writes stay session-local and disappear on disconnect.
                await client.query(`
                  create temp table outbox_events (
                    id uuid primary key,
                    event_name text not null,
                    aggregate_type text not null,
                    aggregate_id text not null,
                    aggregate_version bigint not null,
                    payload jsonb not null,
                    status text not null default 'pending',
                    attempts integer not null default 0,
                    next_attempt_at timestamptz,
                    published_at timestamptz,
                    last_error text,
                    created_at timestamptz not null default now(),
                    lease_token uuid,
                    leased_at timestamptz,
                    lease_expires_at timestamptz
                  ) on commit preserve rows
                `);
                await client.query(`create temp table bookings (id uuid primary key) on commit preserve rows`);
                await client.query(`
                  create temp table booking_access_tokens (
                    id uuid primary key,
                    booking_id uuid not null,
                    purpose text not null,
                    token_hash text not null unique,
                    created_at timestamptz not null,
                    expires_at timestamptz not null,
                    revoked_at timestamptz,
                    last_used_at timestamptz
                  ) on commit preserve rows
                `);

                const db = manager(client);
                const eventId = crypto.randomUUID();
                await client.query(
                  `insert into outbox_events
                    (id,event_name,aggregate_type,aggregate_id,aggregate_version,payload,status,attempts,created_at)
                   values ($1,'synthetic.hyperdrive.outbox','synthetic',$2,1,'{"kind":"synthetic"}'::jsonb,'pending',0,'2000-01-01T00:00:00Z')`,
                  [eventId, crypto.randomUUID()],
                );

                const first = await claimOutboxBatch(db, { limit: 1, leaseSeconds: 30, now: new Date('2026-10-03T10:10:00Z') });
                need(first.length === 1 && first[0].attempts === 1, 'LEASE_FIRST_CLAIM_FAILED');
                need((await claimOutboxBatch(db, { limit: 1, leaseSeconds: 30, now: new Date('2026-10-03T10:10:10Z') })).length === 0, 'ACTIVE_LEASE_DID_NOT_BLOCK');

                const reclaimed = await claimOutboxBatch(db, { limit: 1, leaseSeconds: 30, now: new Date('2026-10-03T10:10:31Z') });
                need(reclaimed.length === 1 && reclaimed[0].id === eventId && reclaimed[0].attempts === 2, 'LEASE_RECLAIM_FAILED');
                need(reclaimed[0].leaseToken !== first[0].leaseToken, 'LEASE_TOKEN_NOT_ROTATED');
                need((await markOutboxPublished(db, eventId, first[0].leaseToken, new Date('2026-10-03T10:10:32Z'))) === false, 'STALE_ACK_ACCEPTED');

                const retry = await scheduleOutboxRetry(db, {
                  eventId,
                  leaseToken: reclaimed[0].leaseToken,
                  errorCode: 'synthetic@example.invalid',
                  now: new Date('2026-10-03T10:10:33Z'),
                });
                need(retry.outcome === 'retry_scheduled' && retry.attempts === 2, 'RETRY_NOT_SCHEDULED');
                need(retry.errorCode === 'DELIVERY_FAILED', 'RETRY_ERROR_NOT_SANITIZED');
                need(retry.nextAttemptAt === '2026-10-03T10:15:33.000Z', 'RETRY_BACKOFF_INVALID');
                need((await claimOutboxBatch(db, { limit: 1, now: new Date('2026-10-03T10:15:32Z') })).length === 0, 'RETRY_CLAIMED_TOO_EARLY');

                const third = await claimOutboxBatch(db, { limit: 1, now: new Date('2026-10-03T10:15:33Z') });
                need(third.length === 1 && third[0].attempts === 3, 'RETRY_DUE_CLAIM_FAILED');
                need(await markOutboxPublished(db, eventId, third[0].leaseToken, new Date('2026-10-03T10:15:34Z')), 'PUBLISH_ACK_FAILED');
                need((await claimOutboxBatch(db, { limit: 1, now: new Date('2026-10-03T10:15:35Z') })).length === 0, 'PUBLISHED_RECLAIMED');
                steps.outboxLeaseRetry = 'PASS';

                const thrownId = crypto.randomUUID();
                await client.query(
                  `insert into outbox_events
                    (id,event_name,aggregate_type,aggregate_id,aggregate_version,payload,status,attempts,created_at)
                   values ($1,'synthetic.publisher.throw','synthetic',$2,1,'{"kind":"synthetic"}'::jsonb,'pending',0,'2000-01-02T00:00:00Z')`,
                  [thrownId, crypto.randomUUID()],
                );
                const summary = await processOutboxBatch(
                  db,
                  { async publish() { throw new Error('PRIVATE-SYNTHETIC@example.invalid'); } },
                  { limit: 1, maxAttempts: 1, now: new Date('2026-10-03T10:16:00Z') },
                );
                need(summary.failedTerminal === 1 && summary.published === 0, 'PUBLISHER_THROW_CONTRACT_FAILED');
                const thrownStored = await client.query('select status,last_error from outbox_events where id=$1', [thrownId]);
                need(thrownStored.rows[0]?.status === 'failed' && thrownStored.rows[0]?.last_error === 'DELIVERY_FAILED', 'PUBLISHER_ERROR_NOT_SANITIZED');
                steps.publisherSanitization = 'PASS';

                const bookingId = crypto.randomUUID();
                await client.query('insert into bookings(id) values($1)', [bookingId]);
                const keyA = await importManageBookingDeliveryDerivationKey('11'.repeat(32));
                const keyB = await importManageBookingDeliveryDerivationKey('22'.repeat(32));
                const a1 = await issueOrReuseManageBookingDeliveryAccess(db, bookingId, '2026-10-10T00:00:00Z', keyA, new Date('2026-10-03T10:20:00Z'));
                const a2 = await issueOrReuseManageBookingDeliveryAccess(db, bookingId, '2026-10-10T00:00:00Z', keyA, new Date('2026-10-03T10:20:10Z'));
                need(!a1.reused && a2.reused && a1.grantId === a2.grantId && a1.rawToken === a2.rawToken, 'DELIVERY_CAPABILITY_NOT_RETRY_STABLE');
                const storedToken = await client.query('select token_hash from booking_access_tokens where booking_id=$1', [bookingId]);
                need(storedToken.rows.length === 1 && !JSON.stringify(storedToken.rows).includes(a1.rawToken), 'RAW_TOKEN_PERSISTENCE_VIOLATION');
                const rotated = await issueOrReuseManageBookingDeliveryAccess(db, bookingId, '2026-10-10T00:00:00Z', keyB, new Date('2026-10-03T10:20:20Z'));
                need(!rotated.reused && rotated.rawToken !== a1.rawToken, 'DERIVATION_KEY_ROTATION_FAILED');

                const manageUrl = buildManageBookingLink('https://myphuquoc.com', a1.rawToken);
                need(manageUrl === `https://myphuquoc.com/manage#${a1.rawToken}`, 'CANONICAL_MANAGE_URL_INVALID');
                const calls: Array<{ headers: Headers; body: string }> = [];
                const provider = createResendManageBookingDeliveryProvider({
                  apiKey: 'synthetic-key',
                  from: 'My Phu Quoc <synthetic@example.invalid>',
                  fetcher: async (_url, init) => {
                    calls.push({ headers: new Headers(init?.headers), body: String(init?.body ?? '') });
                    return new Response(JSON.stringify({ id: 'synthetic-message-id' }), { status: 200, headers: { 'content-type': 'application/json' } });
                  },
                });
                const delivery = { bookingId, channel: 'email' as const, destination: 'synthetic@example.invalid', manageUrl, expiresAt: a1.expiresAt };
                need((await provider.deliver(delivery)).accepted, 'DELIVERY_FIRST_REJECTED');
                need((await provider.deliver(delivery)).accepted, 'DELIVERY_RETRY_REJECTED');
                need(calls.length === 2, 'DELIVERY_CALL_COUNT_INVALID');
                need(calls[0].headers.get('Idempotency-Key') === `manage-booking/${bookingId}`, 'DELIVERY_IDEMPOTENCY_KEY_INVALID');
                need(calls[1].headers.get('Idempotency-Key') === calls[0].headers.get('Idempotency-Key'), 'DELIVERY_IDEMPOTENCY_KEY_UNSTABLE');
                need(calls[1].body === calls[0].body, 'DELIVERY_RETRY_BODY_UNSTABLE');
                steps.deliveryRetryIdempotency = 'PASS';

                return Response.json({ ok: true, steps });
              } catch (error) {
                return Response.json({
                  ok: false,
                  code: typeof error?.message === 'string' && /^[A-Z0-9_]+$/.test(error.message) ? error.message : 'HYPERDRIVE_OUTBOX_TEST_FAILED',
                  pgCode: typeof error?.code === 'string' ? error.code : null,
                  pgTable: typeof error?.table === 'string' ? error.table : null,
                  pgConstraint: typeof error?.constraint === 'string' ? error.constraint : null,
                }, { status: 500 });
              } finally {
                await client.end().catch(() => {});
              }
            },
          };
          NODE
          cat > .tmp-hyperdrive-smoke/wrangler.jsonc <<'JSON'
          {
            "$schema": "../node_modules/wrangler/config-schema.json",
            "name": "myphuquoc-hyperdrive-outbox-isolation-test",
            "main": "./worker.ts",
            "compatibility_date": "2026-09-29",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "hyperdrive": [{ "binding": "HYPERDRIVE", "id": "e5470089fa104a0fb3221d9769ec9474" }]
          }
          JSON
      - name: Exercise leases retry and idempotency through Hyperdrive
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler dev --remote --config .tmp-hyperdrive-smoke/wrangler.jsonc --port 8787 > /tmp/hyperdrive-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            code=$(curl --silent --show-error --max-time 30 -o /tmp/hyperdrive-outbox.json -w '%{http_code}' http://127.0.0.1:8787/ || true)
            if [ "$code" = "200" ] || [ "$code" = "500" ]; then break; fi
            sleep 2
          done
          echo "HTTP_STATUS=${code:-none}"
          cat /tmp/hyperdrive-outbox.json 2>/dev/null || true
          test "${code:-}" = "200"
          grep -q '"ok":true' /tmp/hyperdrive-outbox.json
          grep -q '"outboxLeaseRetry":"PASS"' /tmp/hyperdrive-outbox.json
          grep -q '"publisherSanitization":"PASS"' /tmp/hyperdrive-outbox.json
          grep -q '"deliveryRetryIdempotency":"PASS"' /tmp/hyperdrive-outbox.json
          echo "HYPERDRIVE_OUTBOX_ISOLATION_TEST=PASS"
