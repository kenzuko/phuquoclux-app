name: One-time My Phu Quoc public homepage audit

on:
  push:
    branches:
      - one-time-myphuquoc-custom-domain-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-custom-domain-deploy.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit public homepage, health and canonical redirect
        run: |
          set -euo pipefail

          echo "=== APEX ROOT ==="
          curl --silent --show-error --max-time 20 -D /tmp/root.headers https://myphuquoc.com/ -o /tmp/root.html
          cat /tmp/root.headers
          echo "ROOT_BYTES=$(wc -c < /tmp/root.html)"
          echo "ROOT_TITLE=$(grep -o '<title>[^<]*' /tmp/root.html | head -1 | sed 's/<title>//' || true)"
          grep -q 'My Phu Quoc' /tmp/root.html
          grep -q 'Phú Quốc' /tmp/root.html

          echo "=== ROOT ASSETS ==="
          python - <<'PY'
          import re, pathlib, urllib.parse, subprocess
          html=pathlib.Path('/tmp/root.html').read_text(errors='replace')
          urls=[]
          for pat in [r'<script[^>]+src="([^"]+)"', r'<link[^>]+href="([^"]+)"']:
              urls += re.findall(pat, html)
          seen=[]
          for u in urls:
              if u.startswith('/') and u not in seen:
                  seen.append(u)
          print('ASSET_COUNT', len(seen))
          for u in seen[:20]:
              full='https://myphuquoc.com'+u
              p=subprocess.run(['curl','--silent','--show-error','--max-time','20','-o','/dev/null','-w','%{http_code}',full],capture_output=True,text=True)
              print(p.stdout.strip(), u)
              if p.stdout.strip() not in ('200','204'):
                  raise SystemExit(f'asset failed: {u} -> {p.stdout.strip()}')
          PY

          echo "=== HEALTH ==="
          curl --fail --silent --show-error --max-time 20 https://myphuquoc.com/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"mode":"prototype"' /tmp/health.json

          echo "=== WWW REDIRECT ==="
          headers=$(curl --silent --show-error --max-time 20 -I 'https://www.myphuquoc.com/test-path?x=1' | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -Eq '^HTTP/[^ ]+ (301|308)$'
          echo "$headers" | grep -Fqi 'location: https://myphuquoc.com/test-path?x=1'

          echo "PUBLIC_HOMEPAGE_AUDIT=PASS"
