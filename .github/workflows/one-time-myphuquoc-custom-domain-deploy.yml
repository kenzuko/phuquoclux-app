name: One-time My Phu Quoc Hyperdrive read-only smoke

on:
  push:
    branches:
      - one-time-myphuquoc-custom-domain-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-custom-domain-deploy.yml"

permissions:
  contents: read

jobs:
  hyperdrive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Prepare isolated read-only Hyperdrive smoke worker
        working-directory: web
        run: |
          set -euo pipefail
          mkdir -p .tmp-hyperdrive-smoke
          cat > .tmp-hyperdrive-smoke/worker.mjs <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          export default {
            async fetch(_request, env) {
              const client = new Client({ connectionString: env.HYPERDRIVE.connectionString });
              try {
                await client.connect();
                const ping = await client.query(`
                  select
                    current_database() as database_name,
                    current_user as database_user,
                    to_regclass('public.bookings') is not null as bookings_table,
                    to_regclass('public.outbox_events') is not null as outbox_table,
                    to_regclass('public.booking_access_tokens') is not null as access_table,
                    exists(select 1 from schema_migrations where name = '0006_outbox_delivery_leases.sql') as outbox_lease_migration
                `);
                return Response.json({ ok: true, ...ping.rows[0] });
              } catch (error) {
                return Response.json({ ok: false, code: 'HYPERDRIVE_QUERY_FAILED' }, { status: 500 });
              } finally {
                await client.end().catch(() => {});
              }
            }
          };
          NODE
          cat > .tmp-hyperdrive-smoke/wrangler.jsonc <<'JSON'
          {
            "$schema": "../node_modules/wrangler/config-schema.json",
            "name": "myphuquoc-hyperdrive-readonly-smoke",
            "main": "./worker.mjs",
            "compatibility_date": "2026-09-29",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "hyperdrive": [
              {
                "binding": "HYPERDRIVE",
                "id": "e5470089fa104a0fb3221d9769ec9474"
              }
            ]
          }
          JSON
      - name: Run remote Worker against actual Hyperdrive binding
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler dev --remote --config .tmp-hyperdrive-smoke/wrangler.jsonc --port 8787 > /tmp/hyperdrive-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=false
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8787/ -o /tmp/hyperdrive-smoke.json; then
              ok=true
              break
            fi
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            cat /tmp/hyperdrive-wrangler.log
            exit 1
          fi
          cat /tmp/hyperdrive-smoke.json
          grep -q '"ok":true' /tmp/hyperdrive-smoke.json
          grep -q '"bookings_table":true' /tmp/hyperdrive-smoke.json
          grep -q '"outbox_table":true' /tmp/hyperdrive-smoke.json
          grep -q '"access_table":true' /tmp/hyperdrive-smoke.json
          grep -q '"outbox_lease_migration":true' /tmp/hyperdrive-smoke.json
          echo "HYPERDRIVE_READONLY_SMOKE=PASS"
