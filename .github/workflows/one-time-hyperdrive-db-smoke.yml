name: One-time Hyperdrive DB smoke

on:
  push:
    branches:
      - hyperdrive-db-smoke-20261003

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fix smoke-only Date argument
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/hyperdrive-db-smoke-worker.ts')
          s = p.read_text()
          old = 'new Date(writerNow.getTime() + 1).toISOString() as unknown as Date'
          new = 'new Date(writerNow.getTime() + 1)'
          assert old in s
          p.write_text(s.replace(old, new))
          PY

      - name: Deploy temporary Hyperdrive smoke Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.hyperdrive-smoke.jsonc 2>&1 | tee /tmp/hyperdrive-smoke-deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/hyperdrive-smoke-deploy.log | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run real DB query through Hyperdrive
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          status="000"
          for attempt in $(seq 1 15); do
            status=$(curl --silent --show-error \
              -o /tmp/hyperdrive-db-smoke.json -w '%{http_code}' "$SMOKE_URL" || true)
            if [ "$status" != "404" ] && [ "$status" != "000" ]; then
              break
            fi
            echo "Worker not propagated yet (HTTP $status), attempt $attempt/15"
            sleep 2
          done
          echo "Smoke HTTP status: $status"
          cat /tmp/hyperdrive-db-smoke.json || true
          echo
          test "$status" = "200"
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/hyperdrive-db-smoke.json', 'utf8'));
          const checks = [
            ['ok=true', p.ok === true],
            ['database=phuquoclux_prod', p.database === 'phuquoclux_prod'],
            ['user=phuquoclux_runtime', p.user === 'phuquoclux_runtime'],
            ['bookings table visible', p.bookingsTable === 'bookings'],
            ['booking count returned', /^\d+$/.test(String(p.bookingCount ?? ''))],
            ['migration ledger denied', p.migrationLedgerDenied === true],
            ['permission-denied SQLSTATE', p.migrationLedgerErrorCode === '42501'],
            ['write inserted inside transaction', p.writeInserted === true],
            ['write visible inside transaction', p.writeVisibleInsideTransaction === true],
            ['write rolled back cleanly', p.writeRolledBack === true],
            ['booking writer created inside transaction', p.writerOutcome === 'created'],
            ['booking writer rows visible inside transaction', p.writerRowsVisibleInsideTransaction === true],
            ['booking writer rolled back cleanly', p.writerRolledBackCleanly === true],
            ['guest access issued', p.guestAccessIssued === true],
            ['raw access token not persisted', p.guestAccessRawTokenNotPersisted === true],
            ['guest access redeemed', p.guestAccessRedeemed === true],
            ['manage exchange returns 204', p.guestExchangeStatus === 204],
            ['session cookie security flags', p.guestCookieSecure === true],
            ['manage session resolves booking', p.guestSessionResolved === true],
            ['raw session token not persisted', p.guestSessionRawTokenNotPersisted === true],
            ['parent revoke invalidates session', p.guestParentRevocationInvalidatesSession === true],
            ['guest rows visible inside transaction', p.guestFlowRowsVisibleInsideTransaction === true],
            ['guest flow rolled back cleanly', p.guestFlowRolledBackCleanly === true],
          ];
          for (const [name, pass] of checks) {
            console.log(`${pass ? 'PASS' : 'FAIL'} ${name}`);
            if (!pass) process.exitCode = 1;
          }
          if (process.exitCode) process.exit(process.exitCode);
          console.log(`PASS bookingCount=${p.bookingCount}`);
          NODE

      - name: Delete temporary smoke Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler delete --name phuquoclux-hyperdrive-smoke --force || true
