name: One-time Hyperdrive DB smoke

on:
  push:
    branches:
      - hyperdrive-db-smoke-20261003

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy temporary Hyperdrive smoke Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.hyperdrive-smoke.jsonc 2>&1 | tee /tmp/hyperdrive-smoke-deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/hyperdrive-smoke-deploy.log | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run outbox lease and retry checks
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          status="000"
          for attempt in $(seq 1 15); do
            status=$(curl --silent --show-error \
              -o /tmp/hyperdrive-outbox-smoke.json -w '%{http_code}' "$SMOKE_URL" || true)
            if [ "$status" != "404" ] && [ "$status" != "000" ]; then
              break
            fi
            echo "Worker not propagated yet (HTTP $status), attempt $attempt/15"
            sleep 2
          done
          echo "Smoke HTTP status: $status"
          cat /tmp/hyperdrive-outbox-smoke.json || true
          echo
          test "$status" = "200"
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/hyperdrive-outbox-smoke.json', 'utf8'));
          const checks = [
            ['ok=true', p.ok === true],
            ['success event published', p.successPublished === true],
            ['stale lease rejected', p.staleLeaseRejected === true],
            ['retry scheduled', p.retryScheduled === true],
            ['raw provider error not persisted', p.noRawProviderErrorPersisted === true],
            ['exactly one success claimed', p.successSummary?.claimed === 1],
            ['exactly one success published', p.successSummary?.published === 1],
          ];
          for (const [name, pass] of checks) {
            console.log(`${pass ? 'PASS' : 'FAIL'} ${name}`);
            if (!pass) process.exitCode = 1;
          }
          if (process.exitCode) process.exit(process.exitCode);
          NODE

      - name: Delete temporary smoke Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler delete --name phuquoclux-hyperdrive-smoke --force || true
