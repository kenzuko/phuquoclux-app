name: Deploy PhuQuocLux Preview

on:
  workflow_dispatch:

concurrency:
  group: deploy-phuquoclux-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate preview
        run: npm run check

      - name: Check preview gate
        env:
          PREVIEW_ENABLED: ${{ vars.PHUQUOCLUX_PREVIEW_ENABLED }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true

          if [ "$PREVIEW_ENABLED" != "true" ]; then
            echo "::warning::Preview deploy is disabled. Set PHUQUOCLUX_PREVIEW_ENABLED=true when visual QA is ready."
            ready=false
          fi

          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deploy credentials are missing."
            ready=false
          fi

          echo "PREVIEW_READY=$ready" >> "$GITHUB_ENV"

      - name: Deploy isolated Workers.dev preview
        if: env.PREVIEW_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --name "phuquoclux-app-preview" \
            --var "COMMERCE_MODE:prototype" \
            --var "WEATHER_RUNTIME_BASE_URL:https://weather.openphuquoc.com"
