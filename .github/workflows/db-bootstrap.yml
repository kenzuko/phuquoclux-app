name: Guarded PostgreSQL bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, or apply reviewed migrations
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      expected_database:
        description: Exact PostgreSQL database name
        required: true
        type: string
      expected_host:
        description: Exact PostgreSQL hostname, no wildcard
        required: true
        type: string
      apply_confirmation:
        description: For apply only, enter APPLY:<database>
        required: false
        type: string

concurrency:
  group: phuquoclux-db-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && vars.PHUQUOCLUX_DB_BOOTSTRAP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.PHUQUOCLUX_DATABASE_URL_UNPOOLED }}
      PQL_MIGRATION_EXPECTED_DATABASE: ${{ inputs.expected_database }}
      PQL_MIGRATION_EXPECTED_HOST: ${{ inputs.expected_host }}
    steps:
      - name: Check manual infrastructure gate
        env:
          BOOTSTRAP_ENABLED: ${{ vars.PHUQUOCLUX_DB_BOOTSTRAP_ENABLED }}
          MODE: ${{ inputs.mode }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
        run: |
          set -eu

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Database bootstrap may run only from main."
            exit 1
          fi

          if [ "$BOOTSTRAP_ENABLED" != "true" ]; then
            echo "::error::Database bootstrap is disabled. Set PHUQUOCLUX_DB_BOOTSTRAP_ENABLED=true only for an approved infrastructure operation."
            exit 1
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing PHUQUOCLUX_DATABASE_URL_UNPOOLED secret."
            exit 1
          fi

          if [ -z "$PQL_MIGRATION_EXPECTED_DATABASE" ] || [ -z "$PQL_MIGRATION_EXPECTED_HOST" ]; then
            echo "::error::Expected database and host are required."
            exit 1
          fi

          case "$PQL_MIGRATION_EXPECTED_HOST" in
            *'*'*)
              echo "::error::Wildcard database hosts are forbidden."
              exit 1
              ;;
          esac

          if [ "$MODE" = "apply" ] && [ "$APPLY_CONFIRMATION" != "APPLY:$PQL_MIGRATION_EXPECTED_DATABASE" ]; then
            echo "::error::Apply confirmation must exactly equal APPLY:$PQL_MIGRATION_EXPECTED_DATABASE"
            exit 1
          fi

      - name: Checkout reviewed main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Plan migrations
        run: npm run db:migrate:plan

      - name: Apply reviewed migrations
        if: inputs.mode == 'apply'
        env:
          PQL_MIGRATION_CONFIRM: ${{ inputs.apply_confirmation }}
        run: npm run db:migrate

      - name: Verify final migration plan
        if: inputs.mode == 'apply'
        run: npm run db:migrate:plan

      - name: Record non-secret summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "### PhuQuocLux PostgreSQL bootstrap"
            echo ""
            echo "- mode: $MODE"
            echo "- git ref: $GITHUB_REF"
            echo "- expected database: $PQL_MIGRATION_EXPECTED_DATABASE"
            echo "- expected host: $PQL_MIGRATION_EXPECTED_HOST"
            echo ""
            echo "Connection credentials are intentionally omitted."
          } >> "$GITHUB_STEP_SUMMARY"
