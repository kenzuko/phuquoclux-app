name: One-time My Phu Quoc production deploy

on:
  push:
    branches:
      - one-time-myphuquoc-production-deploy-20261003
    paths:
      - ".github/workflows/one-time-myphuquoc-production-deploy.yml"

concurrency:
  group: one-time-myphuquoc-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout approved main snapshot
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify fail-closed runtime flags
        run: |
          grep -q '"COMMERCE_MODE": "prototype"' wrangler.jsonc
          grep -q '"MANAGE_BOOKING_EXCHANGE_ENABLED": "false"' wrangler.jsonc

      - name: Typecheck
        run: npm run typecheck

      - name: Domain checks
        run: npm run test:domain

      - name: Build
        run: npm run build

      - name: Deploy approved rebrand to existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAP_STYLE_URL: ${{ vars.PHUQUOCLUX_MAP_STYLE_URL || secrets.PHUQUOCLUX_MAP_STYLE_URL || 'https://tiles.openfreemap.org/styles/liberty' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy \
            --var "MAP_STYLE_URL:$MAP_STYLE_URL" \
            --var "WEATHER_RUNTIME_BASE_URL:https://weather.openphuquoc.com" \
            --var "COMMERCE_MODE:prototype" \
            --var "MANAGE_BOOKING_EXCHANGE_ENABLED:false"

      - name: Smoke existing workers.dev endpoint
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 3 https://phuquoclux-app.kenzuko.workers.dev/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"mode":"prototype"' /tmp/health.json
